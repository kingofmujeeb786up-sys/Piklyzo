<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="keywords" content="image compressor, photo resizer, reduce image size in kb, mb to kb converter, online image optimizer, Piklyzo, picture size reducer, compress png jpg">
    <meta name="author" content="Piklyzo">

    <!-- ✅ Google AdSense Meta Tag -->
    <meta name="google-adsense-account" content="ca-pub-6242018188944887">
    
    <!-- ✅ Google AdSense Main Verification Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6242018188944887" crossorigin="anonymous"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header & Country Selector */
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .country-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            cursor: pointer;
            max-width: 180px;
        }

        /* Main Card */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #1e3c72;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        /* Upload Box */
        .upload-area {
            border: 2px dashed #2a5298;
            padding: 25px;
            border-radius: 12px;
            background: #f8fafc;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: #edf2f7;
        }

        .upload-btn {
            background: #2a5298;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Controls Section */
        .controls {
            display: none;
            margin-top: 20px;
            text-align: left;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
        }

        .value-display {
            font-size: 13px;
            color: #2a5298;
            font-weight: bold;
        }

        /* Preview & Download */
        .preview-box {
            display: none;
            margin-top: 20px;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .download-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #059669;
        }

        .info-text {
            font-size: 12px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h2>Piklyzo</h2>
        <!-- Global Country & Language Selector -->
        <select class="country-select" id="countrySelector" onchange="changeLanguage()">
            <option value="EN">🌍 Global (English)</option>
            <option value="IN">🇮🇳 India (हिंदी)</option>
            <option value="US">🇺🇸 USA (English)</option>
            <option value="AE">🇦🇪 UAE (العربية)</option>
            <option value="ES">🇪🇸 Spain (Español)</option>
            <option value="DE">🇩🇪 Germany (Deutsch)</option>
            <option value="FR">🇫🇷 France (Français)</option>
            <option value="JP">🇯🇵 Japan (日本語)</option>
            <option value="CN">🇨🇳 China (中文)</option>
            <option value="BR">🇧🇷 Brazil (Português)</option>
            <option value="RU">🇷🇺 Russia (Русский)</option>
        </select>
    </div>

    <!-- Main Tool Container -->
    <div class="container">
        <h1 id="mainTitle">Universal Image Compressor</h1>
        <p class="subtitle" id="subTitle">Compress, Resize & Convert PNG, JPG, App Icons to KB/MB instantly</p>

        <!-- Hidden File Input -->
        <input type="file" id="fileInput" accept="image/*" hidden>

        <!-- Upload Box -->
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p id="uploadText">📸 Drop your photo or App Icon here / Choose File</p>
            <button class="upload-btn" id="selectBtnText">Select Image</button>
        </div>

        <!-- Image Controls (Quality & Compression) -->
        <div class="controls" id="controlsBox">
            <div class="control-group">
                <label id="qualityLabel">Quality / Adjust Size: <span class="value-display" id="qualityValue">80%</span></label>
                <input type="range" id="qualityRange" min="10" max="100" value="80">
            </div>
            
            <div class="info-text" id="sizeInfo">Original Size: 0 KB | New Size: 0 KB</div>
        </div>

        <!-- Preview & Download Section -->
        <div class="preview-box" id="previewBox">
            <img id="previewImage" alt="Compressed Preview">
            <button class="download-btn" id="downloadBtn">⬇️ Download Compressed Image</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const controlsBox = document.getElementById('controlsBox');
        const previewBox = document.getElementById('previewBox');
        const previewImage = document.getElementById('previewImage');
        const qualityRange = document.getElementById('qualityRange');
        const qualityValue = document.getElementById('qualityValue');
        const sizeInfo = document.getElementById('sizeInfo');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalFile = null;

        // Multi-language text dictionary for global reach
        const texts = {
            EN: { title: "Universal Image Compressor", sub: "Compress, Resize & Convert PNG, JPG, App Icons to KB/MB instantly", upload: "📸 Drop your photo or App Icon here / Choose File", btn: "Select Image", quality: "Quality / Adjust Size:", original: "Original Size", new: "New Size", download: "⬇️ Download Compressed Image" },
            IN: { title: "यूनिवर्सल इमेज कंप्रेसर", sub: "PNG, JPG, ऐप आइकॉन का साइज़ (KB/MB) तुरंत कम या ज्यादा करें", upload: "📸 अपनी फोटो या App Icon यहाँ चुनें", btn: "फोटो चुनें", quality: "क्वालिटी / साइज़ घटाएँ-बढ़ाएँ:", original: "मूल साइज़", new: "नया साइज़", download: "⬇️ कंप्रेस्ड इमेज डाउनलोड करें" },
            US: { title: "Universal Image Compressor", sub: "Compress, Resize & Convert PNG, JPG, App Icons to KB/MB instantly", upload: "📸 Drop your photo or App Icon here / Choose File", btn: "Select Image", quality: "Quality / Adjust Size:", original: "Original Size", new: "New Size", download: "⬇️ Download Compressed Image" },
            AE: { title: "ضاغط الصور الشامل", sub: "ضغط وتغيير حجم صور PNG و JPG و ايقونات التطبيقات بkب/MB فورا", upload: "📸 ضع صورتك أو أيقونة التطبيق هنا", btn: "اختر صورة", quality: "الجودة / ضبط الحجم:", original: "الحجم الأصلي", new: "الحجم الجديد", download: "⬇️ تنزيل الصورة المضغوطة" },
            ES: { title: "Compresor de Imágenes Universal", sub: "Comprime, cambia el tamaño y convierte PNG, JPG, iconos a KB/MB", upload: "📸 Suelta tu foto o icono de aplicación aquí", btn: "Seleccionar Imagen", quality: "Calidad / Ajustar Tamaño:", original: "Tamaño Original", new: "Nuevo Tamaño", download: "⬇️ Descargar Imagen Comprimida" },
            DE: { title: "Universeller Bildkompressor", sub: "Komprimieren, skalieren und konvertieren Sie PNG, JPG, App-Icons in KB/MB", upload: "📸 Ziehen Sie Ihr Foto oder App-Icon hierher", btn: "Bild auswählen", quality: "Qualität / Größe anpassen:", original: "Originalgröße", new: "Neue Größe", download: "⬇️ Komprimiertes Bild herunterladen" },
            FR: { title: "Compresseur d'Images Universel", sub: "Compressez, redimensionnez et convertissez PNG, JPG, icônes en KB/MB", upload: "📸 Déposez votre photo ou icône d'application ici", btn: "Sélectionner l'image", quality: "Qualité / Ajuster la taille:", original: "Taille d'origine", new: "Nouvelle taille", download: "⬇️ Télécharger l'image compressée" },
            JP: { title: "ユニバーサル画像圧縮ツール", sub: "PNG、JPG、アプリコーンをKB/MBに即座に圧縮・リサイズ", upload: "📸 ここに写真またはアプリコーンをドロップ", btn: "画像を選択", quality: "品質 / サイズ調整:", original: "元のサイズ", new: "新しいサイズ", download: "⬇️ 圧縮画像をダウンロード" },
            CN: { title: "通用图像压缩工具", sub: "立即将 PNG、JPG、应用图标压缩、调整大小至 KB/MB", upload: "📸 在此处拖放您的照片或应用图标", btn: "选择图片", quality: "质量/调整大小：", original: "原始大小", new: "新大小", download: "⬇️ 下载压缩图片" },
            BR: { title: "Compressor de Imagem Universal", sub: "Comprima, redimensione e converta PNG, JPG, ícones para KB/MB", upload: "📸 Arraste sua foto ou ícone de aplicativo aqui", btn: "Selecionar Imagem", quality: "Qualidade / Ajustar Tamanho:", original: "Tamanho Original", new: "Novo Tamanho", download: "⬇️ Baixar Imagem Comprimida" },
            RU: { title: "Универсальный компрессор изображений", sub: "Быстрое сжатие, изменение размера PNG, JPG, иконок в КБ/МБ", upload: "📸 Перетащите фото или иконку сюда", btn: "Выбрать изображение", quality: "Качество / Настройка размера:", original: "Исходный размер", new: "Новый размер", download: "⬇️ Скачать сжатое изображение" }
        };

        function changeLanguage() {
            const lang = document.getElementById('countrySelector').value;
            const t = texts[lang] || texts['EN'];
            
            document.getElementById('mainTitle').textContent = t.title;
            document.getElementById('subTitle').textContent = t.sub;
            document.getElementById('uploadText').textContent = t.upload;
            document.getElementById('selectBtnText').textContent = t.btn;
            document.getElementById('qualityLabel').firstChild.nodeValue = t.quality + " ";
            document.getElementById('downloadBtn').textContent = t.download;
            
            if(originalFile) updateSizeDisplay();
        }

        let originalSizeKBVal = 0;
        let compressedSizeKBVal = 0;

        // 1. Image Selection
        fileInput.addEventListener('change', function(e) {
            originalFile = e.target.files[0];
            if (originalFile) {
                controlsBox.style.display = 'block';
                previewBox.style.display = 'block';
                processImage();
            }
        });

        // 2. Quality Range Change
        qualityRange.addEventListener('input', function() {
            qualityValue.textContent = qualityRange.value + '%';
            processImage();
        });

        function updateSizeDisplay() {
            const lang = document.getElementById('countrySelector').value;
            const t = texts[lang] || texts['EN'];
            sizeInfo.innerHTML = `<b>${t.original}:</b> ${originalSizeKBVal} KB | <b>${t.new}:</b> ~${compressedSizeKBVal} KB`;
        }

        // 3. Process & Compress Image Function
        function processImage() {
            if (!originalFile) return;

            const reader = new FileReader();
            reader.readAsDataURL(originalFile);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const quality = qualityRange.value / 100;
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);

                    previewImage.src = compressedDataUrl;

                    // Calculate Sizes in KB
                    originalSizeKBVal = (originalFile.size / 1024).toFixed(2);
                    compressedSizeKBVal = Math.round((compressedDataUrl.length * 3 / 4) / 1024);

                    updateSizeDisplay();

                    // Setup Download Link
                    downloadBtn.onclick = function() {
                        const link = document.createElement('a');
                        link.download = 'Piklyzo_' + originalFile.name;
                        link.href = compressedDataUrl;
                        link.click();
                    };
                };
            };
        }
    </script>
</body>
</html>
