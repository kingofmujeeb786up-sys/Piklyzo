<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piklyzo</title>
    
    <!-- Google AdSense Tag -->
    <meta name="google-adsense-account" content="ca-pub-6242018188944887">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        /* बटन का स्टाइल */
        #uploadBtn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Welcome to Piklyzo</h1>
    <p>अपनी इमेज अपलोड करने के लिए नीचे क्लिक करें:</p>

    <!-- यह इनपुट छिपा हुआ है -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    
    <!-- यह असली बटन है जिसे यूजर दबाएगा -->
    <button id="uploadBtn">Upload Image</button>

    <script>
        const uploadBtn = document.getElementById('uploadBtn');
        const imageInput = document.getElementById('imageInput');

        // जब बटन क्लिक हो, तो इनपुट को ट्रिगर करे
        uploadBtn.addEventListener('click', function() {
            imageInput.click();
        });

        // जब फाइल सेलेक्ट हो जाए
        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                alert("इमेज सेलेक्ट हो गई: " + file.name);
                // यहाँ आप अपनी इमेज प्रोसेसिंग का कोड लिख सकते हैं
            }
        });
    </script>

</body>
</html>
