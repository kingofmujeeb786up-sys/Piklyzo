  <style>
    :root {
      --primary: #1266f1;
      --primary-dark: #0b52c7;
      --primary-soft: #eaf2ff;
      --success: #16834b;
      --danger: #d93025;
      --warning: #b86b00;

      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #687386;
      --border: #dfe5ef;
      --input: #ffffff;
      --shadow: 0 15px 45px rgba(25, 40, 70, 0.08);
      --radius: 18px;
    }

    html.dark {
      --bg: #0c111b;
      --card: #151c29;
      --text: #f2f5fa;
      --muted: #a8b1c1;
      --border: #293446;
      --input: #111824;
      --primary-soft: #172c50;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      transition: background .2s ease, color .2s ease;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      min-width: 0;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 11px;
    }

    .brand-name {
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: -.4px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-select,
    .icon-btn {
      min-height: 42px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 11px;
    }

    .nav-select {
      padding: 0 11px;
      max-width: 150px;
    }

    .icon-btn {
      width: 42px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 1.1rem;
    }

    /* HERO */
    .hero {
      padding: 65px 0 30px;
      text-align: center;
    }

    .hero-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      border-radius: 22px;
      margin-bottom: 15px;
      box-shadow: 0 12px 35px rgba(18,102,241,.18);
    }

    .hero h1 {
      max-width: 900px;
      margin: 0 auto 15px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.08;
      letter-spacing: -1.7px;
    }

    .hero p {
      max-width: 820px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .badge {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: .88rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,.03);
    }

    /* MAIN TOOL */
    .tool-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, .75fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .tool-card {
      padding: 23px;
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin: 0 0 17px;
    }

    .card-title h2,
    .card-title h3 {
      margin: 0;
      font-size: 1.12rem;
    }

    .section {
      padding: 18px 0;
      border-top: 1px solid var(--border);
    }

    .section:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .section-title {
      font-size: .98rem;
      font-weight: 850;
      margin-bottom: 12px;
    }

    /* UPLOAD */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 17px;
      padding: 28px 18px;
      text-align: center;
      transition: .2s ease;
      background: var(--bg);
    }

    .drop-zone.dragover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }

    .upload-icon {
      font-size: 2.3rem;
      margin-bottom: 5px;
    }

    .drop-zone strong {
      display: block;
      font-size: 1.06rem;
      margin-bottom: 4px;
    }

    .drop-zone small {
      color: var(--muted);
      display: block;
      margin-bottom: 14px;
    }

    .file-input {
      display: none;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      min-height: 44px;
      padding: 9px 15px;
      font-weight: 800;
      transition: transform .15s ease, opacity .15s ease, background .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: #feeceb;
      color: var(--danger);
    }

    .button-row {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    /* FORM */
    .field {
      margin-bottom: 13px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: .87rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .hint {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 500;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="color"],
    select {
      width: 100%;
      min-height: 43px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input);
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(18,102,241,.12);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
      font-weight: 750;
    }

    .check-row label {
      margin: 0;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .range-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .value-pill {
      min-width: 55px;
      text-align: center;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 850;
      font-size: .82rem;
    }

    .advanced-box {
      padding: 13px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    /* PRESETS */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .preset {
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 5px;
      font-size: .8rem;
      font-weight: 800;
    }

    .preset:hover,
    .preset.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* PREVIEW */
    .preview-sticky {
      position: sticky;
      top: 92px;
    }

    .preview-empty {
      min-height: 330px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    .preview-empty-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .preview-area {
      padding: 17px;
    }

    .preview-image-wrap {
      position: relative;
      min-height: 300px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
      background:
        linear-gradient(45deg, #eee 25%, transparent 25%),
        linear-gradient(-45deg, #eee 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eee 75%),
        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 22px 22px;
      background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    }

    html.dark .preview-image-wrap {
      background:
        linear-gradient(45deg, #1d2533 25%, transparent 25%),
        linear-gradient(-45deg, #1d2533 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1d2533 75%),
        linear-gradient(-45deg, transparent 75%, #1d2533 75%);
      background-size: 22px 22px;
      background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    }

    .preview-image {
      display: none;
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
