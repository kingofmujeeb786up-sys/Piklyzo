    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header & Country Selector */
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .country-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            cursor: pointer;
            max-width: 180px;
        }

        /* Main Card */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #1e3c72;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        /* Upload Box */
        .upload-area {
            border: 2px dashed #2a5298;
            padding: 25px;
            border-radius: 12px;
            background: #f8fafc;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: #edf2f7;
        }

        .upload-btn {
            background: #2a5298;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Controls Section */
        .controls {
            display: none;
            margin-top: 20px;
            text-align: left;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;

        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input[type="number"]:focus {
            border-color: #2a5298;
        }

        /* Preview & Download */
        .preview-box {
            display: none;
            margin-top: 20px;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .download-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #059669;
        }

        .info-text {
            font-size: 13px;
            color: #334155;
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h2>Piklyzo</h2>
        <!-- Global Country & Language Selector -->
        <select class="country-select" id="countrySelector" onchange="changeLanguage()">
            <option value="EN">🌍 Global (English)</option>
            <option value="IN">🇮🇳 India (हिंदी)</option>
            <option value="US">🇺🇸 USA (English)</option>
            <option value="AE">🇦🇪 UAE (العربية)</option>
            <option value="ES">🇪🇸 Spain (Español)</option>
            <option value="DE">🇩🇪 Germany (Deutsch)</option>
            <option value="FR">🇫🇷 France (Français)</option>
            <option value="JP">🇯🇵 Japan (日本語)</option>
            <option value="CN">🇨🇳 China (中文)</option>
            <option value="BR">🇧🇷 Brazil (Português)</option>
            <option value="RU">🇷🇺 Russia (Русский)</option>
        </select>
    </div>

    <!-- Main Tool Container -->
    <div class="container">
        <h1 id="mainTitle">Universal Image Compressor</h1>
        <p class="subtitle" id="subTitle">Compress, Resize & Convert PNG, JPG, App Icons to KB/MB instantly</p>

        <!-- Hidden File Input -->
        <input type="file" id="fileInput" accept="image/*" hidden>

        <!-- Upload Box -->
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p id="uploadText">📸 Drop your photo or App Icon here / Choose File</p>
            <button class="upload-btn" id="selectBtnText">Select Image</button>
        </div>

        <!-- Image Controls (Target KB Input) -->
        <div class="controls" id="controlsBox">
            <div class="control-group">
                <label id="targetLabel" for="targetKbInput">Enter Desired Size (in KB):</label>
                <input type="number" id="targetKbInput" placeholder="e.g. 50" min="5">
            </div>
            
            <div class="info-text" id="sizeInfo">Original Size: 0 KB | New Size: 0 KB</div>
        </div>

        <!-- Preview & Download Section -->
        <div class="preview-box" id="previewBox">
            <img id="previewImage" alt="Compressed Preview">
            <button class="download-btn" id="downloadBtn">⬇️ Download Compressed Image</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const controlsBox = document.getElementById('controlsBox');
        const previewBox = document.getElementById('previewBox');
        const previewImage = document.getElementById('previewImage');
        const targetKbInput = document.getElementById('targetKbInput');
        const sizeInfo = document.getElementById('sizeInfo');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalFile = null;
        let finalDataUrl = "";

        // Multi-language text dictionary
        const texts = {
            EN: { title: "Universal Image Compressor", sub: "Compress, Resize & Convert PNG, JPG, App Icons to KB/MB instantly", upload: "📸 Drop your photo or App Icon here / Choose File", btn: "Select Image", target: "Enter Desired Size (in KB):", original: "Original Size", new: "New Size", download: "⬇️ Download Compressed Image" },
            IN: { title: "यूनिवर्सल इमेज कंप्रेसर", sub: "PNG, JPG, ऐप आइकॉन का साइज़ (KB/MB) मनपसंद KB में बदलें", upload: "📸 अपनी फोटो या App Icon यहाँ चुनें", btn: "फोटो चुनें", target: "मनचाहा साइज़ दर्ज करें (KB में):", original: "मूल साइज़", new: "नया साइज़", download: "⬇️ कंप्रेस्ड इमेज डाउनलोड करें" },
            US: { title: "Universal Image Compressor", sub: "Compress, Resize & Convert PNG, JPG, App Icons to KB/MB instantly", upload: "📸 Drop your photo or App Icon here / Choose File", btn: "Select Image", target: "Enter Desired Size (in KB):", original: "Original Size", new: "New Size", download: "⬇️ Download Compressed Image" },
            AE: { title: "ضاغط الصور الشامل", sub: "ضغط وتغيير حجم صور PNG و JPG و ايقونات التطبيقات بالحجم المطلوب", upload: "📸 ضع صورتك أو أيقونة التطبيق هنا", btn: "اختر صورة", target: "أدخل الحجم المطلوب (بالكيلوبايت):", original: "الحجم الأصلي", new: "الحجم الجديد", download: "⬇️ تنزيل الصورة المضغوطة" },
            ES: { title: "Compresor de Imágenes Universal", sub: "Comprime, cambia el tamaño y convierte PNG, JPG, iconos al tamaño exacto en KB", upload: "📸 Suelta tu foto o icono de aplicación aquí", btn: "Seleccionar Imagen", target: "Ingrese el tamaño deseado (en KB):", original: "Tamaño Original", new: "Nuevo Tamaño", download: "⬇️ Descargar Imagen Comprimida" },
            DE: { title: "Universeller Bildkompressor", sub: "Komprimieren, skalieren und konvertieren Sie PNG, JPG, App-Icons in gewünschte KB-Größe", upload: "📸 Ziehen Sie Ihr Foto oder App-Icon hierher", btn: "Bild auswählen", target: "Gewünschte Größe eingeben (in KB):", original: "Originalgröße", new: "Neue Größe", download: "⬇️ Komprimiertes Bild herunterladen" },
            FR: { title: "Compresseur d'Images Universel", sub: "Compressez, redimensionnez et convertissez PNG, JPG, icônes à la taille souhaitée", upload: "📸 Déposez votre photo ou icône d'application ici", btn: "Sélectionner l'image", target: "Entrez la taille souhaitée (en Ko):", original: "Taille d'origine", new: "Nouvelle taille", download: "⬇️ Télécharger l'image compressée" },
            JP: { title: "ユニバーサル画像圧縮ツール", sub: "希望のKBサイズに即座に圧縮・リサイズ", upload: "📸 ここに写真またはアプリコーンをドロップ", btn: "画像を選択", target: "希望サイズを入力 (KB):", original: "元のサイズ", new: "新しいサイズ", download: "⬇️ 圧縮画像をダウンロード" },
            CN: { title: "通用图像压缩工具", sub: "轻松将图片压缩至您指定的KB大小", upload: "📸 在此处拖放您的照片或应用图标", btn: "选择图片", target: "输入所需大小 (KB)：", original: "原始大小", new: "新大小", download: "⬇️ 下载压缩图片" },
            BR: { title: "Compressor de Imagem Universal", sub: "Comprima e redimensione imagens para o tamanho exato em KB", upload: "📸 Arraste sua foto ou ícone de aplicativo aqui", btn: "Selecionar Imagem", target: "Insira o tamanho desejado (em KB):", original: "Tamanho Original", new: "Novo Tamanho", download: "⬇️ Baixar Imagem Comprimida" },
            RU: { title: "Универсальный компрессор изображений", sub: "Сжатие изображений до точного размера в КБ", upload: "📸 Перетащите фото или иконку сюда", btn: "Выбрать изображение", target: "Введите желаемый размер (в КБ):", original: "Исходный размер", new: "Новый размер", download: "⬇️ Скачать сжатое изображение" }
        };

        function changeLanguage() {
            const lang = document.getElementById('countrySelector').value;
            const t = texts[lang] || texts['EN'];
            
            document.getElementById('mainTitle').textContent = t.title;
            document.getElementById('subTitle').textContent = t.sub;
            document.getElementById('uploadText').textContent = t.upload;
            document.getElementById('selectBtnText').textContent = t.btn;
            document.getElementById('targetLabel').textContent = t.target;
            document.getElementById('downloadBtn').textContent = t.download;
            
            if(originalFile) processImage();
        }

        fileInput.addEventListener('change', function(e) {
            originalFile = e.target.files[0];
            if (originalFile) {
                controlsBox.style.display = 'block';
                previewBox.style.display = 'block';
                // Default target value set to half of original or 50KB as starting point
                const defaultKb = Math.min(Math.round(originalFile.size / 1024), 100);
                targetKbInput.value = defaultKb > 10 ? defaultKb : 20;
                processImage();
            }
        });

        targetKbInput.addEventListener('input', function() {
            if(originalFile) processImage();
        });

        function processImage() {
            if (!originalFile) return;

            const reader = new FileReader();
            reader.readAsDataURL(originalFile);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const targetKB = parseFloat(targetKbInput.value) || 50;
                    
                    // Binary search approach to hit target KB closely
                    let low = 0.01;
                    let high = 1.0;
                    let quality = 0.8;
                    let bestDataUrl = canvas.toDataURL('image/jpeg', quality);

                    // Quick iterative estimation for quality control
                    for (let i = 0; i < 5; i++) {
                        bestDataUrl = canvas.toDataURL('image/jpeg', quality);
                        let currentKB = (bestDataUrl.length * 3 / 4) / 1024;
                        
                        if (Math.abs(currentKB - targetKB) < 2) break;
                        
                        if (currentKB > targetKB) {
                            high = quality;
                            quality = (low + quality) / 2;
                        } else {
                            low = quality;
                            quality = (quality + high) / 2;
                        }
                    }

                    finalDataUrl = bestDataUrl;
                    previewImage.src = finalDataUrl;

                    const originalSizeKBVal = (originalFile.size / 1024).toFixed(2);
                    const compressedSizeKBVal = Math.round((finalDataUrl.length * 3 / 4) / 1024);

                    const lang = document.getElementById('countrySelector').value;
                    const t = texts[lang] || texts['EN'];
                    sizeInfo.innerHTML = `<b>${t.original}:</b> ${originalSizeKBVal} KB | <b>${t.new}:</b> ~${compressedSizeKBVal} KB`;
                };
            };
        }

        downloadBtn.onclick = function() {
            if (!finalDataUrl || !originalFile) return;
            const link = document.createElement('a');
            link.download = 'Piklyzo_' + targetKbInput.value + 'KB_' + originalFile.name;
            link.href = finalDataUrl;
            link.click();
        };
    </script>
</body>
</html>
